name: pipeline-smoke

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Compile Python files
        run: python -m compileall .

      - name: Smoke check scaffold files
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import sys

          files = [
              "sender_windows.py",
              "receiver_mac.py",
              "receiver_ai.py",
              "receiver_ai_v2.py",
              "recorder.py",
              "diagnose.py",
              "freq_finder.py",
              "train.py",
              "scripts/split_dataset.py",
              "scripts/extract_features.py",
              "scripts/export_model.py",
          ]
          for path in files:
              assert pathlib.Path(path).exists(), f"Missing scaffold file: {path}"
              print(f"checked {path}")

          result = subprocess.run(
              [sys.executable, "sender_windows.py"],
              capture_output=True,
              text=True,
          )
          assert result.returncode != 0, "sender_windows.py should fail loudly until implemented"
          message = (result.stdout + result.stderr).lower()
          assert "implement" in message and "sender_windows.py" in message, (
              f"Unexpected sender output: {message!r}"
          )
          print("checked sender_windows.py behavior")
          PY
